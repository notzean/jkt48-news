name: Update News Data

on:
  workflow_dispatch:

  schedule:
    # Jalan tiap 5 menit, tapi offset supaya tidak pas menit ramai
    - cron: "2-59/5 * * * *"

  push:
    branches:
      - main
    paths-ignore:
      - "last-news.json"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run update script
        env:
          URL_API: ${{ secrets.URL_API }}
          URL_WEBHOOK: ${{ secrets.URL_WEBHOOK }}
        run: node index.js

      - name: Commit last-news.json
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add last-news.json
          git commit -m "Update last-news.json" || echo "No changes"
          git push
