name: JKT48 News Webhook

on:
  schedule:
    # Jalan tiap 5 menit
    - cron: "*/5 * * * *"

  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: jkt48-news-webhook
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JKT48 news script
        env:
          URL_API: ${{ secrets.URL_API }}
          URL_WEBHOOK: ${{ secrets.URL_WEBHOOK }}
        run: node index.js

      - name: Commit last-news.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add last-news.json

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada last-news.json"
          else
            git commit -m "Update last sent news"
            git push
          fi
