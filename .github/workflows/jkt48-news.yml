# This workflow will check latest JKT48 news and send it to Discord webhook

name: Update News Data

on:
  push:
    branches:
      - main
    paths-ignore:
      - "last-news.json"

  schedule:
    # GitHub Actions minimum schedule is every 5 minutes
    # Offset supaya tidak kena menit ramai seperti :00, :05, :10
    - cron: "2-59/5 * * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check trigger info
        run: |
          echo "Event: ${{ github.event_name }}"
          date -u

      - name: Run Update Script
        env:
          URL_API: ${{ secrets.URL_API }}
          URL_WEBHOOK: ${{ secrets.URL_WEBHOOK }}
        run: node index.js

      - name: Update last-news.json on GitHub
        uses: test-room-7/action-update-file@v1
        with:
          file-path: last-news.json
          commit-msg: Update last-news.json
          github-token: ${{ secrets.GH_TOKEN }}
          branch: main
