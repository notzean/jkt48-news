# This workflow will check latest JKT48 news and send it to Discord webhook

name: Update News Data

on:
  push:
    branches:
      - main
    paths-ignore:
      - "last-news.json"

  schedule:
    # Kamu minta gaya lama.
    # Catatan: GitHub tetap membatasi scheduled workflow minimal sekitar 5 menit.
    - cron: "* * * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      # Checkout repository
      - uses: actions/checkout@v2
        with:
          token: ${{ secrets.GH_TOKEN }}

      # Setup Node.js environment
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run script to fetch news and send Discord webhook
      - name: Run Update Script
        env:
          URL_API: ${{ secrets.URL_API }}
          URL_WEBHOOK: ${{ secrets.URL_WEBHOOK }}
        run: node index.js

      # Update last-news.json on GitHub
      - name: Update last-news.json on GitHub
        uses: test-room-7/action-update-file@v1
        with:
          file-path: last-news.json
          commit-msg: Update last-news.json
          github-token: ${{ secrets.GH_TOKEN }}
          branch: main
