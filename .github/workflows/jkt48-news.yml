# This workflow will update the news.json file every minute
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Update News Data

on:
  push:
  schedule:
    # Runs the job every minute
    - cron: "* * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    # Checkout the repository to access the files
    - uses: actions/checkout@v2

    # Setup Node.js environment
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}

    # Install dependencies
    - run: npm ci

    # Run the script to update the last-news.json
    - name: Run Update Script
      env:
          URL_API: ${{ secrets.URL_API }}
          URL_WEBHOOK: ${{ secrets.URL_WEBHOOK }}
      run: node index.js

    # Update last-news.json file and push the changes
    - name: Update last-news.json on GitHub
      uses: test-room-7/action-update-file@v1
      with:
        file-path: last-news.json
        commit-msg: Update last-news.json
        github-token: ${{ secrets.GH_TOKEN }}
        branch: main
